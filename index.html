<title>Think Pink</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky two-tier header (brand+account, then page nav), 1180px column, card grids, tabbed dashboards */
:root{
--bg:#fff6f9;--bg2:#ffeaf2;--surface:#fff;--surface2:#fff0f6;--ink:#3a1228;--muted:#785069;--line:#f4d4e2;
--accent:#c8245f;--accent-ink:#fff;--accent-strong:#a81a4d;--accent-soft:#ffe0ec;--accent-deep:#7d1440;

--hdr:rgba(255,246,249,.94);--shadow:0 1px 2px rgba(122,20,64,.06),0 10px 30px rgba(122,20,64,.08);--focus:#7d1440;
--display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;--r:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#1b0e16;--bg2:#25131e;--surface:#2a1722;--surface2:#331c29;--ink:#fbe8f1;--muted:#cba3b7;--line:#4b2c3d;
--accent:#ff6fa6;--accent-ink:#2a0a18;--accent-strong:#ff8db8;--accent-soft:#4a2236;--accent-deep:#ffd1e3;
--good:#5fd3ae;--good-soft:#15382f;--warn:#f2b866;--warn-soft:#3e2e12;--bad:#ff8f86;--bad-soft:#4a1d1b;--info:#aeb2ff;--info-soft:#25274a;
--hdr:rgba(27,14,22,.94);--shadow:0 1px 2px #0006,0 10px 30px #0005;--focus:#ffd1e3;color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#1b0e16;--bg2:#25131e;--surface:#2a1722;--surface2:#331c29;--ink:#fbe8f1;--muted:#cba3b7;--line:#4b2c3d;
--accent:#ff6fa6;--accent-ink:#2a0a18;--accent-strong:#ff8db8;--accent-soft:#4a2236;--accent-deep:#ffd1e3;
--good:#5fd3ae;--good-soft:#15382f;--warn:#f2b866;--warn-soft:#3e2e12;--bad:#ff8f86;--bad-soft:#4a1d1b;--info:#aeb2ff;--info-soft:#25274a;
--hdr:rgba(27,14,22,.94);--shadow:0 1px 2px #0006,0 10px 30px #0005;--focus:#ffd1e3;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);margin:0;min-height:100%}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:30}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0 0 .5em;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,5.5vw,3.5rem);font-weight:700}h2{font-size:clamp(1.5rem,3.2vw,2.1rem)}h3{font-size:1.2rem}h4{font-size:1rem}
p{margin:0 0 .8em}a{color:var(--accent-strong)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}.small{font-size:.86rem}.tc{text-align:center}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--hdr);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand .lg{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#ff8fb8,#c8245f);color:#fff;display:grid;place-items:center;flex:none}
.brand .lg svg{width:26px;height:26px}
.brand b{font-family:var(--display);font-size:1.25rem;letter-spacing:.06em;display:block;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.72rem;line-height:1.2}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}

.nav a:hover{background:var(--accent-soft);color:var(--accent-strong)}
.nav a.on{background:var(--accent);color:var(--accent-ink)}
.menu-btn{display:none}
.userchip{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.88rem;background:var(--accent-soft);padding:4px 12px 4px 4px;border-radius:999px}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.78rem;font-weight:700}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;text-decoration:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
@media(max-width:900px){
 .menu-btn{display:grid}.nav{display:none;flex-direction:column;overflow:visible}.nav.open{display:flex}
 .nav a{padding:11px 14px}.userchip span.nm{display:none}.userchip{padding:4px}.brand small{display:none}
}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:999px;padding:11px 20px;font:600 .94rem var(--body);cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s;min-height:44px}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(200,36,95,.28)}
.btn-soft{background:var(--accent-soft);color:var(--accent-strong)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-sm{padding:6px 14px;min-height:36px;font-size:.84rem}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
/* layout */
main{padding-block:28px 56px;min-height:70vh}
main.enter>*{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
section.blk{margin-top:52px}
.eyebrow{display:inline-block;font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-strong);background:var(--accent-soft);padding:5px 12px;border-radius:999px;margin-bottom:14px}
.lead{font-size:1.12rem;color:var(--muted);max-width:60ch}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);min-width:0}
.card.soft{background:var(--surface2);box-shadow:none}
.card h3{display:flex;align-items:center;gap:9px}
.ico{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;margin-bottom:12px}
.ico .ic{width:24px;height:24px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h2{margin:0}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;background:linear-gradient(135deg,var(--bg2),var(--surface2) 55%,var(--accent-soft));border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,52px)}
.hero h1{margin-bottom:.35em}
.slogan{font-family:var(--display);font-size:1.3rem;font-weight:600;color:var(--accent-strong)}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.flow{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.float{animation:flo 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flo{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.stat{text-align:center}
.stat b{display:block;font:700 2.2rem var(--display);color:var(--accent-strong);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:3px 10px;border-radius:999px}
/* pills & banners */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}
.note{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px;background:var(--info-soft);color:var(--ink);margin:14px 0}
.note .ic{color:var(--info);margin-top:3px}
.note.warn{background:var(--warn-soft)}.note.warn .ic{color:var(--warn)}
.note.bad{background:var(--bad-soft)}.note.bad .ic{color:var(--bad)}
.note.good{background:var(--good-soft)}.note.good .ic{color:var(--good)}
.note p{margin:0}
/* forms */
.form{display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label,.lbl{font-weight:600;font-size:.88rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;width:100%;min-height:44px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--accent)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.opt{display:flex;gap:10px;align-items:center;padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.err{color:var(--bad);font-weight:600;min-height:1.2em;margin:0}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--bad);transition:width .2s,background .2s}
.narrow{max-width:640px;margin-inline:auto}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--surface2);border-radius:999px;border:1px solid var(--line);width:max-content;max-width:100%;margin-bottom:20px}
.tabs button{border:0;background:none;color:var(--muted);font:600 .86rem var(--body);padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
/* lists */
.li{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}.li .grow{flex:1 1 220px;min-width:0}
.li h4{margin:0 0 2px}
.date-box{width:56px;text-align:center;border-radius:14px;background:var(--accent-soft);color:var(--accent-strong);padding:6px 0;flex:none;line-height:1.1}
.date-box b{display:block;font:700 1.35rem var(--display)}.date-box span{font-size:.68rem;font-weight:700;text-transform:uppercase}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.scroll{overflow-x:auto}
/* timeline */
.prog{display:flex;gap:0;margin:6px 0 22px;overflow-x:auto;padding-bottom:4px}
.prog div{flex:1 0 96px;text-align:center;position:relative;font-size:.74rem;font-weight:600;color:var(--muted)}
.prog div::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:4px;background:var(--line)}
.prog div:first-child::before{display:none}
.prog i{position:relative;z-index:1;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;margin:0 auto 6px;background:var(--surface);border:3px solid var(--line);font-style:normal;font-size:.8rem}
.prog .done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.prog .done::before,.prog .active::before{background:var(--accent)}
.prog .active i{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}.prog .active,.prog .done{color:var(--ink)}
details.stage{border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:10px;overflow:hidden}
details.stage summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 18px;font-weight:700}
details.stage summary::-webkit-details-marker{display:none}
details.stage summary .sp{flex:1;min-width:0}
details.stage.active{border-color:var(--accent)}
.stage-b{padding:4px 18px 18px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.stage-b h5{margin:0 0 4px;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ent{padding:8px 0;border-top:1px dashed var(--line);font-size:.9rem}.ent:first-of-type{border-top:0}
.by{font-size:.76rem;color:var(--muted)}
/* flip cards */
.flip{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:20px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-height:150px;box-shadow:var(--shadow)}
.flip .fact{display:none}.flip.open .myth{display:none}.flip.open .fact{display:block}.flip.open{background:var(--good-soft)}
.mf{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
/* quiz */
.qopt{display:block;width:100%;text-align:left;font:600 .95rem var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;margin-top:10px;cursor:pointer}
.qopt:hover:not(:disabled){border-color:var(--accent)}.qopt.ok{background:var(--good-soft);border-color:var(--good)}.qopt.no{background:var(--bad-soft);border-color:var(--bad)}
.qbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--accent)}
/* month nodes */
.mon{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.mn{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:center}
.mn i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 8px;background:var(--good)}
.mn.new i{background:#e6a23c}.mn.ongoing i{background:var(--bad)}.mn.empty i,.mn.none i,.mn.open i{background:var(--line)}
.mn b{display:block;font-size:.84rem}.mn span{font-size:.74rem;color:var(--muted)}
/* dashboards */
.dash-h{border-radius:26px;padding:clamp(20px,4vw,36px);margin-bottom:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.dash-h.prev{background:linear-gradient(120deg,var(--bg2),var(--accent-soft));border:1px solid var(--line)}
.dash-h.canc{background:linear-gradient(120deg,#7d1440,#c8245f);color:#fff}
.dash-h.canc h1,.dash-h.canc p{color:#fff}.dash-h h1{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:.2em}
.dash-h.canc .pill{background:rgba(255,255,255,.2);color:#fff}
.split{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.pt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.pt.on{border-color:var(--accent);background:var(--accent-soft)}.pt small{display:block;color:var(--muted)}
.gate{max-width:560px;margin:30px auto;text-align:center}
.gate-ic{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;margin:0 auto 14px}
.gate-ic .ic{width:28px;height:28px}
.chart text{fill:var(--muted);font:11px var(--body)}.chart .ln{stroke:var(--accent);stroke-width:3;fill:none}.chart .gr{stroke:var(--line)}
.chart .band{fill:var(--good-soft)}.chart circle{fill:var(--surface);stroke:var(--accent);stroke-width:3}
/* modal & toast */
#modal .ov{position:fixed;inset:0;background:rgba(40,8,25,.55);z-index:60}
#modal .dlg{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 32px);overflow:auto;background:var(--surface);color:var(--ink);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:rise .25s ease}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 0}.dlg-h h3{margin:0}.dlg-b{padding:16px 22px 22px}
pre.rep{white-space:pre-wrap;font:.84rem/1.55 var(--body);background:var(--surface2);border-radius:12px;padding:14px;margin:0 0 10px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--accent-deep);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);animation:rise .25s ease}
footer{border-top:1px solid var(--line);background:var(--surface2);padding-block:34px calc(34px + env(safe-area-inset-bottom,0px))}
.fgrid{display:grid;grid-template-columns:2fr repeat(auto-fit,minmax(140px,1fr));gap:24px}
footer a{display:block;color:var(--muted);text-decoration:none;padding:3px 0}footer a:hover{color:var(--accent-strong)}
footer h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.unread{border-left:4px solid var(--accent)}
.chipbox{display:grid;gap:12px}
.step{display:flex;gap:14px;align-items:flex-start}.step b.n{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.sw{position:relative;width:46px;height:26px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:.2s}.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--accent)}.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:3px solid var(--focus);outline-offset:2px}
</style>

<script>
(function(){

const KEY='thinkpink.v2';

function monthEntries(uid_,k){return S.monthly.find(m=>m.userId===uid_&&m.month===k)}
const flagged=r=>!!r&&(r.sym==='yes'||(r.changes||[]).length>0);
function series(uid_,n){const cm=curMonth(),out=[];let prev=false;
 for(let i=(n||6)-1;i>=0;i--){const k=addM(cm,-i);const r=monthEntries(uid_,k);const u=user(uid_);
  const before=u&&k<u.created.slice(0,7);const f=flagged(r);
  let s=before?'none':!r?(k===cm?'open':'empty'):f?(prev?'ongoing':'new'):(r.submitted?'clear':'empty');
  out.push({k:k,rec:r,flag:f,state:s});prev=f}
 return out}
function tick(){
 const T=today(),cm=curMonth();
 S.users.filter(u=>u.role==='patient').forEach(u=>{
  S.appts.filter(a=>a.userId===u.id&&a.status==='upcoming').forEach((a,i)=>{
   const left=diffDays(a.date,T);const r=a.remind||u.remind||3;
   if(left>=0&&left<=r){const when=left===0?'today':left===1?'tomorrow':'in '+left+' days';
    notify(u.id,'appointment','Upcoming: '+a.type+' '+when,REM[(a.date.length+left+i)%3]+' '+fmt(a.date)+' at '+a.time+'.','rem:'+a.id+':'+a.date)}});
  if(u.type==='prevention'){
   notify(u.id,'screening','Monthly breast health check-in for '+mlabel(cm),TIPS[parseInt(cm.slice(5),10)-1]+' Follow your doctor’s recommended screening schedule.','monthly:'+cm);
   const start=u.created.slice(0,7);
   for(let k=start;k<cm;k=addM(k,1)){
    let r=monthEntries(u.id,k);
    if(!r){S.monthly.push({id:uid('m'),userId:u.id,month:k,status:'final',sym:'no',changes:[],note:'',results:'',concerns:'',auto:true,submitted:false})}
    else if(r.status==='draft')r.status='final'}
   const sr=series(u.id,6);const last=sr.filter(x=>x.flag).pop();
   if(last)notify(u.id,'screening','Change noted in your monthly records',PATTERN_MSG,'pattern:'+last.k);
  }});
 save();
}

function lineChart(pts,ref){

 if(ref)s+='<rect class="band" x="'+L+'" y="'+Y(ref[1])+'" width="'+(W-L-R)+'" height="'+(Y(ref[0])-Y(ref[1]))+'"/>';
 for(let v=mn;v<=mx;v++)s+='<line class="gr" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';

 return s+'</svg>'}

 affirm(){UI.affirm++;render()},
 again(){UI.sent=false;render()},
 copyq(){copy(ASK.map(g=>g[0]+':\n'+g.slice(1).map(x=>'- '+x).join('\n')).join('\n\n'),'Questions copied')},
 qpick(a){const q=UI.quiz;if(q.sel!=null)return;q.sel=+a.dataset.i;if(q.sel===QUIZ[q.i][2])q.score++;render()},
 qnext(){const q=UI.quiz;if(q.i+1<QUIZ.length){q.i++;q.sel=null}else{q.done=true;if(S.quizBest==null||q.score>S.quizBest)S.quizBest=q.score;save()}render()},
 qrestart(){UI.quiz={i:0,sel:null,score:0,done:false};render()},
 forgot(){modal('Reset password','<form class="form" data-form="forgot"><p class="small muted">In a live service a secure link would be emailed. In this demo you can set a new password directly.</p><div class="field"><label for="fp-e">Email Address</label><input id="fp-e" name="email" type="email"></div><div class="field"><label for="fp-p">New password</label><input id="fp-p" name="pw" type="password"></div><div class="field"><label for="fp-p2">Confirm new password</label><input id="fp-p2" name="pw2" type="password"></div><p class="err" role="alert"></p><button class="btn btn-primary" type="submit">Update password</button></form>')},
 aadd(){modal('Add appointment',apptForm(null,'new'))},
 aedit(a){modal('Edit appointment',apptForm(S.appts.find(x=>x.id===a.dataset.id),'edit'))},
 aresched(a){modal('Reschedule appointment',apptForm(S.appts.find(x=>x.id===a.dataset.id),'resched'))},
 acomplete(a){modal('Mark as completed','<form class="form" data-form="complete"><input type="hidden" name="id" value="'+a.dataset.id+'"><div class="field"><label for="ac-r">Result note (optional)</label><textarea id="ac-r" name="result"></textarea></div><button class="btn btn-primary" type="submit">Mark completed</button></form>')},
 adel(a){const x=S.appts.find(y=>y.id===a.dataset.id);modal('Delete appointment','<p>Delete <b>'+esc(x.type)+'</b> on '+fmt(x.date)+'?</p><div class="btns"><button class="btn btn-danger" data-act="adelok" data-id="'+x.id+'">Delete</button><button class="btn btn-ghost" data-act="close">Keep it</button></div>')},
 adelok(a){S.appts=S.appts.filter(x=>x.id!==a.dataset.id);save();closeModal();render();toast('Appointment deleted')},
 markread(a){const n=S.notifs.find(x=>x.id===a.dataset.id);n.read=true;save();render()},
 markall(){S.notifs.filter(n=>n.userId===S.session).forEach(n=>n.read=true);save();render();toast('All marked as read')},
 chipconsent(a){UI.chip.consent=a.checked;if(!a.checked){UI.chip.tapped=false;UI.chip.log.unshift(fmt(today())+' · Consent withdrawn. Access closed.')}render()},
 chiptap(){const c=UI.chip;if(!c.consent){c.log.unshift('Tap refused: patient consent is off.');toast('Tap refused. Consent is off.')}else{c.tapped=true;c.log.unshift(fmt(today())+' · Dr. Sara Al Mansoori opened the verified record.')}render()},
 chipme(a){me().chip=a.checked;save();toast(a.checked?'Chip concept preview on':'Chip concept preview off');render()},
 dxreq(){modal('Update my account status',dxRequestForm())},
 closemonth(){const r=monthEntries(S.session,curMonth());if(!r){toast('Save a check-in first');return}r.status='final';save();render();toast('Report created')},
 viewrep(a){const r=S.monthly.find(x=>x.id===a.dataset.id),u=me();const t=reportText(r,u);modal('Monthly Health Record','<pre class="rep" id="reptext">'+esc(t)+'</pre><div class="btns" style="margin:0"><button class="btn btn-primary btn-sm" data-act="copyrep">'+ic('copy')+' Copy report</button><button class="btn btn-soft btn-sm" data-act="sharerep" data-id="'+r.id+'">'+ic('send')+' Share with my doctor</button></div>')},
 copyrep(){copy($('#reptext').textContent,'Report copied')},
 sharerep(a){const u=me(),r=S.monthly.find(x=>x.id===a.dataset.id);if(!u.authorized.length){toast('Authorize a doctor first under Privacy');location.hash='privacy';closeModal();return}
  u.authorized.forEach(did=>{if(!S.shared.some(s=>s.userId===u.id&&s.month===r.month&&s.doctorId===did)){S.shared.push({id:uid('s'),userId:u.id,month:r.month,doctorId:did,date:today()});notify(did,'report',u.name+' shared a monthly record',mlabel(r.month))}});save();closeModal();toast('Shared securely with your authorized doctor')},
 viewdoc(a){const u=me();const pid=a.dataset.pid||u.id;const rec=S.rec[pid];const r=rec.reports.find(x=>x.id===a.dataset.id);addAudit(pid,u.name,'Opened report: '+r.title);modal(r.title,'<div class="note good">'+ic('lock')+'<p>Opened through a secure viewer. This access was logged.</p></div><p class="small muted">'+esc(r.name)+' · '+esc(r.size)+' · '+esc(r.doctor)+' · '+fmt(r.date)+'</p><p>'+esc(r.summary)+'</p>')},
 auth(a){const u=me(),d=a.dataset.d;if(a.checked){if(!u.authorized.includes(d)){u.authorized.push(d);notify(d,'account','New patient authorization',u.name+' granted you access to their record.')}toast('Access granted')}else{u.authorized=u.authorized.filter(x=>x!==d);toast('Access withdrawn')}save();render()},
 docsel(a){UI.docPt=a.dataset.id;UI.docTab='overview';render()},
 docadd(a){const p=user(a.dataset.id);modal('Add to '+p.name+'’s record',recForm(p))},
 verify(a){modal('Verify diagnosis',verifyForm(user(a.dataset.id)))},
 reject(a){const p=user(a.dataset.id),d=me();if(p.dxRequest)p.dxRequest.status='declined';if(p.type==='cancer'&&!(S.rec[p.id]&&S.rec[p.id].verified)){p.type='prevention';delete S.rec[p.id]}notify(p.id,'account','Diagnosis could not be verified',d.name+' could not verify a diagnosis. Please contact your doctor.');save();render();toast('Patient notified')},
 resolve(a){const e=S.rec[a.dataset.pid].entries.find(x=>x.id===a.dataset.id);e.resolved=true;e.resolvedBy=me().name;save();render();toast('Marked as reviewed')},
 reset(){if(!UI.resetArm){UI.resetArm=true;render();return}UI.resetArm=false;S=seed();save();location.hash='home';render(true);toast('Demo data restored')}
};
function copy(t,msg){const ok=()=>toast(msg||'Copied');try{navigator.clipboard.writeText(t).then(ok,()=>toast('Select the text and copy it manually'))}catch(e){toast('Select the text and copy it manually')}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=acts[a.dataset.act];if(!f)return;if(a.type==='checkbox')return;if(a.tagName==='A')e.preventDefault();f(a,e)});
document.addEventListener('change',e=>{const a=e.target;
 if(a.matches('input[type=checkbox][data-act]')){acts[a.dataset.act](a);return}
 if(a.dataset.change==='role'){const doc=a.value==='doctor';$('#patOnly').hidden=doc;$('#docOnly').hidden=!doc}
 if(a.dataset.change==='reckind'){const f=a.closest('form');$('#recfields').innerHTML=recFields(a.value,user(f.pid.value))}});
document.addEventListener('input',e=>{if(e.target.dataset.input==='pw'){const v=e.target.value;let s=0;if(v.length>=8)s++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;const m=$('#pwm');m.style.width=(s*25)+'%';m.style.background=s<2?'var(--bad)':s<3?'#e6a23c':'var(--good)'}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=forms[f.dataset.form];if(h)h(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
window.addEventListener('hashchange',()=>{UI.menu=false;UI.resetArm=false;if(route()!=='contact')UI.sent=false;if(!$('#modal').hidden)closeModal();render(true)});
tick();
if(!location.hash)history.replaceState(null,'','#home');
render(true);
})();
</script>

</body></html>
